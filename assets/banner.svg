<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Radial Glows (100% Camo & GitHub CSP Safe) -->
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glow Blobs in Background (Using SMIL animate for universal support) -->
  <circle cx="220" cy="90" r="220" fill="url(#glowBlue)" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.85;0.4" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="180" r="240" fill="url(#glowPurple)" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Grid Lines / Matrix Accents (Subtle Architectural Grid) -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.22">
    <line x1="50" y1="0" x2="50" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="350" y1="0" x2="350" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="650" y1="0" x2="650" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="950" y1="0" x2="950" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="290" x2="1200" y2="290" />
  </g>

  <!-- Side Illustration: Flow / Pipeline Architecture -->
  <g transform="translate(850, 45)">
    <!-- Connecting Animated Pipelines -->
    <path d="M 60,65 L 180,65 L 180,140 L 60,200" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,6" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2.5s" repeatCount="indefinite" />
    </path>
    <path d="M 180,140 L 250,140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2.5s" repeatCount="indefinite" />
    </path>

    <!-- Card 1: Hierarchical Config (Floating Animation with SMIL animateTransform) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="6s" repeatCount="indefinite" />
      <rect x="0" y="25" width="165" height="75" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="20" cy="45" r="4" fill="#38bdf8" />
      <text x="32" y="49" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#38bdf8">base.yaml</text>
      <text x="20" y="72" font-family="Courier, monospace" font-size="11" fill="#94a3b8">app: v2.4.0</text>
      <text x="20" y="87" font-family="Courier, monospace" font-size="11" fill="#94a3b8">env: production</text>
    </g>

    <!-- Card 2: Environment Overrides (Floating Animation with SMIL animateTransform) -->
    <g transform="translate(80, 110)">
      <animateTransform attributeName="transform" type="translate" values="80,110; 80,98; 80,110" dur="5s" repeatCount="indefinite" />
      <rect x="0" y="0" width="175" height="85" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="20" cy="22" r="4" fill="#818cf8" />
      <text x="32" y="26" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#a5b4fc">runtime.override</text>
      <text x="20" y="47" font-family="Courier, monospace" font-size="11" fill="#64748b">PORT=8080</text>
      <text x="20" y="63" font-family="Courier, monospace" font-size="11" fill="#38bdf8">DEBUG=false</text>
      <text x="20" y="78" font-family="Courier, monospace" font-size="11" fill="#34d399">✓ Type Validated</text>
    </g>

    <!-- Floating Mini Pill -->
    <g transform="translate(-10, 175)">
      <animateTransform attributeName="transform" type="translate" values="-10,175; -10,167; -10,175" dur="6s" repeatCount="indefinite" />
      <rect x="0" y="0" width="125" height="32" rx="16" fill="#1e1b4b" stroke="#c084fc" stroke-width="1" />
      <text x="14" y="21" font-family="Courier, monospace" font-size="11" fill="#e9d5ff">⚡ Multi-Source</text>
    </g>
  </g>

  <!-- Foreground Main Branding & Titles (Guaranteed Crisp & High-Contrast Foreground) -->
  <g transform="translate(80, 85)">
    <!-- Pill Category Badge -->
    <rect x="0" y="0" width="235" height="30" rx="15" fill="#0f2942" stroke="#0284c7" stroke-width="1" />
    <text x="16" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#38bdf8" letter-spacing="0.5">⚡ AWESOME CONFIGURATION</text>

    <!-- Main Title -->
    <text x="0" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="46" fill="#ffffff">
      Configuration Frameworks
    </text>

    <!-- Gradient Underline Accent -->
    <rect x="0" y="92" width="530" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle / Tagline -->
    <text x="0" y="132" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="19" fill="#94a3b8">
      Curated ecosystem of hierarchical, type-safe &amp; multi-source
    </text>
    <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="19" fill="#94a3b8">
      configuration management tools, SaaS platforms, and libraries.
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8">✦ Type Safety</text>

      <rect x="115" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="127" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#818cf8">✦ 12-Factor App</text>

      <rect x="245" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="257" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#c084fc">✦ CLI Overrides</text>

      <rect x="370" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="382" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#34d399">✦ Secret Syncing</text>
    </g>
  </g>
</svg>
