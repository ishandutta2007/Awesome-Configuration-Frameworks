<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Radial Glows (Pure SVG, 100% Camo & GitHub CSP Safe - No feFilter) -->
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #38bdf8;
        letter-spacing: 0.5px;
      }
      .node-text {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 11px;
        fill: #cbd5e1;
      }

      /* Dynamic Animations (Kept strictly to background & side components so title is never obscured) */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.85; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -36; }
      }

      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatFast 5s ease-in-out infinite;
      }
      .pulse-bg {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 6, 6;
        animation: dashMove 2.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glow Blobs in Background (Radial Gradients - No Filter dependencies) -->
  <circle cx="220" cy="90" r="220" fill="url(#glowBlue)" class="pulse-bg" />
  <circle cx="1020" cy="180" r="240" fill="url(#glowPurple)" class="pulse-bg" />

  <!-- Grid Lines / Matrix Accents (Subtle Architectural Grid) -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.22">
    <line x1="50" y1="0" x2="50" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="350" y1="0" x2="350" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="650" y1="0" x2="650" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="950" y1="0" x2="950" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="290" x2="1200" y2="290" />
  </g>

  <!-- Side Illustration: Flow / Pipeline Architecture -->
  <g transform="translate(850, 45)">
    <!-- Connecting Animated Pipelines -->
    <path d="M 60,65 L 180,65 L 180,140 L 60,200" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6" class="flow-line" />
    <path d="M 180,140 L 250,140" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" class="flow-line" />

    <!-- Card 1: Hierarchical Config (Floating Animation) -->
    <g class="floating-card-1">
      <rect x="0" y="25" width="165" height="75" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="20" cy="45" r="4" fill="#38bdf8" />
      <text x="32" y="49" class="node-text" font-weight="bold" fill="#38bdf8">base.yaml</text>
      <text x="20" y="72" class="node-text" fill="#94a3b8">app: v2.4.0</text>
      <text x="20" y="87" class="node-text" fill="#94a3b8">env: production</text>
    </g>

    <!-- Card 2: Environment Overrides (Floating Animation) -->
    <g class="floating-card-2" transform="translate(80, 110)">
      <rect x="0" y="0" width="175" height="85" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="20" cy="22" r="4" fill="#818cf8" />
      <text x="32" y="26" class="node-text" font-weight="bold" fill="#a5b4fc">runtime.override</text>
      <text x="20" y="47" class="node-text" fill="#64748b">PORT=8080</text>
      <text x="20" y="63" class="node-text" fill="#38bdf8">DEBUG=false</text>
      <text x="20" y="78" class="node-text" fill="#34d399">✓ Type Validated</text>
    </g>

    <!-- Floating Mini Pill -->
    <g class="floating-card-1" transform="translate(-10, 175)">
      <rect x="0" y="0" width="125" height="32" rx="16" fill="#1e1b4b" stroke="#c084fc" stroke-width="1" />
      <text x="14" y="21" class="node-text" fill="#e9d5ff">⚡ Multi-Source</text>
    </g>
  </g>

  <!-- Foreground Main Branding & Titles (Guaranteed Crisp & High-Contrast Foreground) -->
  <g transform="translate(80, 85)">
    <!-- Pill Category Badge -->
    <rect x="0" y="0" width="235" height="30" rx="15" fill="#0f2942" stroke="#0284c7" stroke-width="1" />
    <text x="16" y="20" class="badge-text">⚡ AWESOME CONFIGURATION</text>

    <!-- Main Title -->
    <text x="0" y="75" class="title-text">
      Configuration Frameworks
    </text>

    <!-- Gradient Underline Accent -->
    <rect x="0" y="92" width="530" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle / Tagline -->
    <text x="0" y="132" class="subtitle-text">
      Curated ecosystem of hierarchical, type-safe &amp; multi-source
    </text>
    <text x="0" y="160" class="subtitle-text">
      configuration management tools, SaaS platforms, and libraries.
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" class="node-text" fill="#38bdf8">✦ Type Safety</text>

      <rect x="115" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="127" y="17" class="node-text" fill="#818cf8">✦ 12-Factor App</text>

      <rect x="245" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="257" y="17" class="node-text" fill="#c084fc">✦ CLI Overrides</text>

      <rect x="370" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="382" y="17" class="node-text" fill="#34d399">✦ Secret Syncing</text>
    </g>
  </g>
</svg>
